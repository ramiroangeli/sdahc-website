# Generates a PROPOSED listing snapshot on a new branch and opens a pull request for review.
#
# Safe by design, and inert until this branch is merged:
#  - Manual only (workflow_dispatch). No schedule, no webhook, no repository_dispatch, no Deploy Hook.
#  - It never pushes to main and never deploys. It pushes a new "listing/..." branch and opens a PR.
#  - Publication happens only when a person reviews and merges that PR, under the existing branch
#    protections. The merge is the explicit approval; the diff is the traceable record.
#  - It only reads Notion, with a read-only integration token.
# Read docs/listings-runbook.md before enabling it. The same steps can be run locally instead.
name: Propose listing snapshot

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROPOSE to confirm'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    if: github.repository == 'ramiroangeli/sdahc-website' && inputs.confirm == 'PROPOSE'
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PROPERTIES_DATA_SOURCE_ID: ${{ secrets.NOTION_PROPERTIES_DATA_SOURCE_ID }}
      LISTINGS_MEDIA_BASE_URL: ${{ vars.LISTINGS_MEDIA_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Create review branch
        id: branch
        run: |
          BRANCH="listing/proposal-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate proposed snapshots
        run: node scripts/listings-sync.mjs --propose --write

      - name: Open a pull request for review
        run: |
          git config user.name "sdahc-listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add src/data/listings/approved
          if git diff --cached --quiet; then echo "No changes to propose."; exit 0; fi
          git commit -m "Propose listing snapshot from Notion"
          # the target is always the generated review branch, never main
          git push origin "HEAD:refs/heads/${{ steps.branch.outputs.name }}"
          gh pr create --base main --head "${{ steps.branch.outputs.name }}" \
            --title "Propose listing snapshot from Notion" \
            --body "Generated from the Notion Properties database. Review the public content, price mode and photographs, then merge to publish. Not live until merged and deployed."
