# Required check for changes to main. The branch rules require the job below (site-checks) to pass before anything merges.
# It runs on pull requests, and can also be started on a branch (workflow_dispatch): pull requests opened by the publication job use the
# workflow token, and GitHub deliberately does not start pull_request workflows for that token.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    name: site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISTINGS_MEDIA_BASE_URL: ${{ vars.LISTINGS_MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Listings tests (privacy, pricing, compliance, snapshots)
        run: npm run test:listings
      - name: Production build
        run: npm run build
      - name: Privacy scan of the build output
        run: npm run check:privacy
